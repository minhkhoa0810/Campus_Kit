  promoBanner = "MIỄN PHÍ VẬN CHUYỂN KÝ TÚC XÁ CHO ĐƠN TỪ 199.000₫ — NHẬP MÃ SINHVIEN11 GIẢM THÊM 15%"
  address = "227 Nguyễn Văn Cừ, Phường Chợ Quán, TP. Hồ Chí Minh (CS1 – ĐH Khoa học Tự nhiên)"
  hotline = "1900 6868 (08:00 – 21:30 mỗi ngày)"
  email = "hello@campuskit.vn"

  [params.hero]
