<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "vi" }}" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.brandName }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}" />
  <link rel="icon" type="image/png" href="{{ "images/logo-icon.png" | relURL }}" />
  <link rel="apple-touch-icon" href="{{ "images/logo-icon.png" | relURL }}" />

  <!-- Google Fonts: Inter (300, 400, 500, 600, 700) paired with SF Pro stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#0F1E36',
              dark: '#081120',
              light: '#1B3254',
              subtle: '#F0F4FA'
            },
            ink: '#1D1D1F',
            ash: '#F5F5F7',
            line: '#D2D2D7',
            apple: {
              blue: '#0071E3',
              blueHover: '#0077ED',
              ink: '#1D1D1F',
              muted: '#6E6E73',
              canvas: '#F5F5F7',
              orange: '#B64400'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif']
          },
          boxShadow: {
            section: '2px 4px 12px rgba(0, 0, 0, 0.06)',
            card: '2px 4px 12px rgba(0, 0, 0, 0.06)',
            'card-hover': '2px 6px 18px rgba(0, 0, 0, 0.12)'
          }
        }
      }
    };
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      font-weight: 400;
      color: #1D1D1F;
      background-color: #F5F5F7;
      background-image: radial-gradient(ellipse 90% 240px at 50% 0%, rgba(255,255,255,0.95), transparent);
      background-repeat: no-repeat;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* =========================================================================
       APPLE STORE DESIGN SYSTEM — TYPOGRAPHY, SHELVES, PILLS & CARDS
       ========================================================================= */
    .as-shelf-title {
      font-size: clamp(1.45rem, 2.4vw, 1.75rem);
      line-height: 1.22;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1D1D1F;
    }

    .as-title-muted {
      color: #6E6E73;
      font-weight: 600;
    }

    .as-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #B64400;
    }

    .as-card-hero {
      border-radius: 28px;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.07);
      transition: transform 0.35s cubic-bezier(0, 0, 0.5, 1), box-shadow 0.35s cubic-bezier(0, 0, 0.5, 1);
    }
    .as-card-hero:hover {
      transform: scale(1.015);
      box-shadow: 2px 6px 18px rgba(0, 0, 0, 0.13);
    }

    .ck-section-box {
      background-color: #FFFFFF;
      border-radius: 28px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.06);
    }

    .ck-elevated-card {
      background-color: #FFFFFF;
      border-radius: 22px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.06);
      transition: transform 0.32s cubic-bezier(0, 0, 0.5, 1), box-shadow 0.32s cubic-bezier(0, 0, 0.5, 1);
    }
    .ck-elevated-card:hover {
      transform: scale(1.014);
      box-shadow: 2px 6px 18px rgba(0, 0, 0, 0.12);
    }

    .as-pill-blue {
      background-color: #0071E3;
      color: #FFFFFF;
      border-radius: 980px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    .as-pill-blue:hover {
      background-color: #0077ED;
    }

    .as-pill-outline {
      background-color: transparent;
      color: #1D1D1F;
      border: 1px solid #86868B;
      border-radius: 980px;
      height: 38px;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .as-pill-outline:hover {
      background-color: #1D1D1F;
      color: #FFFFFF;
      border-color: #1D1D1F;
    }

    .as-shelf-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 8px 4px 20px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .as-shelf-track::-webkit-scrollbar {
      display: none;
    }

    .as-paddle-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background: rgba(210, 210, 215, 0.64);
      color: #1D1D1F;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, opacity 0.2s ease;
    }
    .as-paddle-btn:hover:not([disabled]) {
      background: rgba(210, 210, 215, 0.92);
    }
    .as-paddle-btn[disabled] {
      opacity: 0.32;
      cursor: default;
    }

    /* Quick-Filter Category Pills inside Search Curtain */
    .nav-tab {
      transition: all 0.2s ease;
    }
    .nav-tab.active {
      background-color: #1D1D1F;
      color: #FFFFFF;
      border-color: #1D1D1F;
      font-weight: 500;
    }

    .uniqlo-card-img { transition: transform 0.5s cubic-bezier(0, 0, 0.5, 1); }
    .uniqlo-card:hover .uniqlo-card-img { transform: scale(1.035); }

    /* =========================================================================
       3D STUDY FLASHCARD PRODUCT SYSTEM (APPLE STORE ELEVATION)
       ========================================================================= */
    .ck-flashcard {
      perspective: 1400px;
    }
    .ck-flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: box-shadow 0.32s cubic-bezier(0, 0, 0.5, 1);
      border-radius: 24px;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.06);
    }
    .ck-flashcard:hover .ck-flashcard-inner:not(.is-flipped) {
      box-shadow: 2px 6px 18px rgba(0, 0, 0, 0.12);
    }
    .ck-flashcard-face {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 24px;
      border: 1px solid rgba(0,0,0,0.04);
      background-color: #FFFFFF;
      overflow: hidden;
    }
    .ck-flashcard-front {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }
    .ck-flashcard-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #FBFBFD;
      background-image: radial-gradient(rgba(29, 29, 31, 0.08) 0.9px, transparent 0.9px);
      background-size: 16px 16px;
      pointer-events: none;
      z-index: 1;
    }
    .ck-flashcard-inner.is-flipped .ck-flashcard-front {
      pointer-events: none;
    }
    .ck-flashcard-inner.is-flipped .ck-flashcard-back {
      pointer-events: auto;
      z-index: 3;
    }

    /* Rounded Apple Range Slider */
    input[type="range"].ck-range {
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 999px;
      background: #D2D2D7;
      outline: none;
    }
    input[type="range"].ck-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #0071E3;
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }
    input[type="range"].ck-range::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #0071E3;
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }
  </style>
</head>
<body id="top" class="text-ink selection:bg-apple-blue selection:text-white min-h-screen flex flex-col">

  {{- partial "header.html" . -}}

  <main class="flex-1 pb-6">
    {{- block "main" . }}{{- end }}
  </main>

  {{- partial "footer.html" . -}}
  {{- partial "modals.html" . -}}

  <!-- Global Structured Data for Cross-Page Cart, Vouchers & Order Tracking -->
  <script id="campuskit-global-data" type="application/json">
    {{- dict
      "baseURL" ("" | relURL)
      "products" hugo.Data.products
      "vouchers" hugo.Data.vouchers
      "ordersData" hugo.Data.orders
    | jsonify | safeJS -}}
  </script>
  <script src="{{ "js/vendor/gsap.min.js" | relURL }}" defer></script>
  <script src="{{ "js/vendor/ScrollTrigger.min.js" | relURL }}" defer></script>
  <script src="{{ "js/vendor/Flip.min.js" | relURL }}" defer></script>
  <script src="{{ "js/gsap-animations.js" | relURL }}?v=26" defer></script>
  <script src="{{ "js/app.js" | relURL }}?v=26" defer></script>
</body>
</html>
