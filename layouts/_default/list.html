{{ define "main" }}
<section class="bg-[#f5f5f7] pt-8 sm:pt-12 pb-12 sm:pb-16">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav aria-label="Breadcrumb" class="text-xs text-[#6e6e73] mb-4 flex items-center gap-2">
      <a href="{{ "/" | relURL }}" class="hover:text-[#1d1d1f] transition-colors">Cửa hàng</a>
      <span class="text-[#d2d2d7]">/</span>
      <span class="text-[#1d1d1f] font-medium">{{ .Title }}</span>
    </nav>

    <div class="mb-8">
      <h1 class="text-3xl sm:text-5xl font-semibold tracking-[-0.025em] text-[#1d1d1f] leading-[1.12]">
        {{ .Title }}
      </h1>
      {{ with .Description }}
      <p class="text-base sm:text-lg text-[#6e6e73] leading-relaxed mt-3 max-w-3xl">
        {{ . }}
      </p>
      {{ end }}
    </div>

    <div class="rounded-[28px] bg-white p-8 sm:p-12 shadow-[2px_4px_12px_rgba(0,0,0,0.05)]">
      {{ with .Content }}
      <div class="prose max-w-none text-[15px] text-[#1d1d1f] leading-relaxed mb-8 space-y-4">
        {{ . }}
      </div>
      {{ end }}

      {{ if .Pages }}
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="group rounded-2xl bg-[#f5f5f7] hover:bg-[#e8e8ed]/80 p-5 transition-colors block">
          <h2 class="text-base font-semibold text-[#1d1d1f] group-hover:text-[#0071e3] transition-colors">{{ .Title }}</h2>
          {{ with .Description }}
          <p class="text-xs text-[#6e6e73] mt-1.5 line-clamp-2">{{ . }}</p>
          {{ end }}
        </a>
        {{ end }}
      </div>
      {{ end }}

      <a
        href="{{ "/san-pham/" | relURL }}"
        class="as-pill-blue inline-flex items-center justify-center rounded-full bg-[#0071e3] hover:bg-[#0077ed] active:bg-[#006edb] text-white text-sm font-medium py-3.5 px-7 shadow-sm transition-all"
      >
        Khám phá sản phẩm CampusKit
      </a>
    </div>
  </div>
</section>
{{ end }}
