{{ define "main" }}
<section class="bg-[#f5f5f7] pt-8 sm:pt-12 pb-12 sm:pb-16">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav aria-label="Breadcrumb" class="text-xs text-[#6e6e73] mb-4 flex items-center gap-2">
      <a href="{{ "/" | relURL }}" class="hover:text-[#1d1d1f] transition-colors">Cửa hàng</a>
      <span class="text-[#d2d2d7]">/</span>
      <span class="text-[#1d1d1f] font-medium">{{ .Title }}</span>
    </nav>

    <article class="rounded-[28px] bg-white p-8 sm:p-12 shadow-[2px_4px_12px_rgba(0,0,0,0.05)]">
      <header class="pb-6 mb-6 border-b border-[#d2d2d7]/60">
        <p class="text-xs font-semibold tracking-tight text-[#b64400] mb-2">
          CampusKit Editorial
        </p>
        <h1 class="text-3xl sm:text-4xl font-semibold tracking-[-0.025em] text-[#1d1d1f] leading-tight">
          {{ .Title }}
        </h1>
        {{ with .Description }}
        <p class="text-base text-[#6e6e73] mt-3 leading-relaxed">
          {{ . }}
        </p>
        {{ end }}
      </header>

      <div class="text-[15px] text-[#1d1d1f] leading-relaxed space-y-4">
        {{ .Content }}
      </div>

      <div class="pt-8 mt-8 border-t border-[#d2d2d7]/50">
        <a
          href="{{ "/san-pham/" | relURL }}"
          class="text-sm font-medium text-[#0066cc] hover:underline inline-flex items-center gap-1"
        >
          <span>Quay lại cửa hàng CampusKit</span>
          <span aria-hidden="true">›</span>
        </a>
      </div>
    </article>
  </div>
</section>
{{ end }}
